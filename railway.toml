[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "python run.py"
healthcheckPath = "/health"
# Seconds Railway waits for /health to succeed after container start.
# Cold start includes MCP widget registration + DB readiness retries (~90-120s
# worst case) before the process accepts traffic.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
ENVIRONMENT = "production"
DEBUG = "false"
SERVERLESS_ENABLED = "true"
# Burst headroom for the app-side pool (DB_NULL_POOL is false). Overflow
# connections open per use and close on return. The SSE chat uses the BG pool.
DB_MAX_OVERFLOW = "10"
# Wait at most 5 s for a pool connection: the web Worker gives up after 6 s, so a longer
# wait only queues work nobody reads and keeps the pool full after a burst.
DB_POOL_TIMEOUT = "5"
DB_BG_MAX_OVERFLOW = "8"
PUBLIC_BASE_URL = "https://api.360ghar.com"
