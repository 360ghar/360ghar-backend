[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "python run.py"
healthcheckPath = "/health"
# Seconds Railway waits for /health to succeed after container start.
# Cold start includes MCP widget registration + DB readiness retries (~90-120s
# worst case) before the process accepts traffic.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
ENVIRONMENT = "production"
DEBUG = "false"
SERVERLESS_ENABLED = "true"
# Burst headroom for the app-side pool (DB_NULL_POOL is false). Overflow
# connections open per use and close on return. The SSE chat uses the BG pool.
DB_MAX_OVERFLOW = "10"
# Main pool: wait at most 5 s for a connection, then answer 503. The web Worker gives up
# after 6 s; uvicorn does not cancel the handler then, so a longer wait only queues work
# nobody reads. The Railway service variable must carry the same value (it wins over this
# file). The background pool (jobs, SSE chat) keeps DB_BG_POOL_TIMEOUT (default 15 s).
DB_POOL_TIMEOUT = "5"
DB_BG_MAX_OVERFLOW = "8"
PUBLIC_BASE_URL = "https://api.360ghar.com"
