openapi: 3.1.0
info:
  title: 360 Flatmates API
  description: |
    Curated API contract for the 360 Flatmates surfaces (web + mobile) — a swipe-based
    flatmate-finding app for India's young professionals.

    This is a hand-maintained, flatmates-focused subset of the full backend OpenAPI spec.
    The authoritative full spec is `docs/openapi.json` in `360ghar-backend`, generated by
    `scripts/generate_openapi.py`. Every path here MUST exist in that spec — if a path in
    this file is not in `docs/openapi.json`, it is stale and must be removed. The mirror
    copy in `360-flatmates-web/docs/flatmates-openapi.yaml` is kept byte-identical to this
    file.

    ## Authentication
    All endpoints require authentication via Bearer token in the `Authorization` header, unless marked as public.
    Tokens are obtained via Supabase Auth (Phone OTP + Password).

    ## User Modes
    - **room_poster** — Has a flat, wants to rent out a spare room
    - **co_hunter** — Looking for people to flat-search with
    - **open_to_both** — Flexible, open to either

    ## Base URL
    `/api/v1`
  version: 1.1.0
  contact:
    name: 360 Ghar
    url: https://360ghar.com
  license:
    name: Confidential
    url: https://360ghar.com

servers:
  - url: https://api.360ghar.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local Development

tags:
  - name: Auth
    description: User authentication and session management
  - name: Bootstrap
    description: Initial data loading after authentication
  - name: Profiles
    description: Flatmate profile CRUD and discovery
  - name: Catalogs
    description: Server-driven business metadata
  - name: Swipes
    description: Swipe actions and compatibility matching
  - name: Likes
    description: Incoming likes and match management
  - name: Matches
    description: Active matches and unmatching
  - name: Conversations
    description: Chat conversations and messages
  - name: Visits
    description: Flatmate meet scheduling and management
  - name: Listings
    description: Property listing CRUD and discovery
  - name: Notifications
    description: Push and in-app notifications
  - name: Blocks & Reports
    description: User safety, blocking, and reporting
  - name: Interactions
    description: Profile views and society tag voting
  - name: Admin Moderation
    description: Admin-only listing and report moderation

paths:
  # ===================== AUTH =====================
  /users/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Validate the authenticated user exists and return basic user info.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [Auth]
      summary: Delete my account
      description: >-
        Permanently delete the authenticated user's account. Calls the Supabase
        Admin API to hard-delete the auth user, then anonymizes PII and
        soft-deletes the local row to preserve referential integrity with
        properties/visits/bookings. This action is irreversible.
        App Store Guideline 5.1.1(v) compliance.
      operationId: deleteCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Identity provider temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                example: 30

  /auth/delete-account:
    post:
      tags: [Auth]
      summary: Delete my account (alternate)
      description: >-
        Permanently delete the authenticated user's account (alternate route).
        Same behavior as `DELETE /users/me` — hard-deletes the Supabase Auth
        user, anonymizes PII, and soft-deletes the local row. Returns 204 No
        Content on success. Provided for mobile clients that prefer POST over
        DELETE. App Store Guideline 5.1.1(v) compliance.
      operationId: deleteAccountViaPost
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account deleted (no content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Identity provider temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                example: 30

  /users/location:
    get:
      tags: [Auth]
      summary: Get user location
      description: Returns the current user's location data.
      operationId: getUserLocation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLocation'

  # ===================== BOOTSTRAP =====================
  /flatmates/bootstrap:
    get:
      tags: [Bootstrap]
      summary: Bootstrap data
      description: Load profile, catalogs, and activity counts after authentication.
      operationId: getFlatmatesBootstrap
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Bootstrap data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatmatesBootstrap'

  # ===================== CATALOGS =====================
  /flatmates/catalogs:
    get:
      tags: [Catalogs]
      summary: Get business catalogs
      description: Server-driven business metadata (modes, timelines, quiz dimensions, vibe tags, report reasons, icebreakers, room types, furnishing options, etc.).
      operationId: getFlatmatesCatalogs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogEntry'

  # ===================== PROFILES =====================
  /flatmates/profile:
    get:
      tags: [Profiles]
      summary: Get my flatmate profile
      description: Fetch the authenticated user's flatmate profile.
      operationId: getMyFlatmatesProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Flatmate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatmatesProfile'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Profiles]
      summary: Update my flatmate profile
      description: Update the authenticated user's flatmate profile fields.
      operationId: updateMyFlatmatesProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatmatesProfileUpdate'
      responses:
        '200':
          description: Updated flatmate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatmatesProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flatmates/profiles:
    get:
      tags: [Profiles]
      summary: Discover profiles
      description: Fetch discoverable peer profiles for the swipe deck. Applies deal-breaker (non-negotiables) and discovery filtering.
      operationId: discoverProfiles
      security:
        - BearerAuth: []
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: Filter by city
        - name: budget_min
          in: query
          schema:
            type: integer
            minimum: 0
          description: Minimum budget
        - name: budget_max
          in: query
          schema:
            type: integer
            minimum: 0
          description: Maximum budget
        - name: move_in
          in: query
          schema:
            type: string
            enum: [immediate, this_month, next_month, flexible]
          description: Move-in timeline filter
        - name: age_min
          in: query
          schema:
            type: integer
            minimum: 18
            maximum: 100
          description: Minimum age for peer profiles (unknown ages pass)
        - name: age_max
          in: query
          schema:
            type: integer
            minimum: 18
            maximum: 100
          description: Maximum age for peer profiles (unknown ages pass)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of profiles to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Pagination offset
      responses:
        '200':
          description: List of discoverable peer profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlatmatesPeer'

  /flatmates/profiles/{user_id}:
    get:
      tags: [Profiles]
      summary: Get flatmate profile by user
      description: Fetch a single peer's flatmate profile by user id.
      operationId: getFlatmateProfileByUser
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Peer flatmate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatmatesPeer'
        '400':
          $ref: '#/components/responses/BadRequest'

  /flatmates/profiles/{user_id}/compatibility:
    get:
      tags: [Profiles]
      summary: Get compatibility breakdown with a flatmate
      description: Return the full lifestyle compatibility breakdown between the current user and the peer.
      operationId: getFlatmateCompatibility
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Compatibility breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityBreakdown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== SWIPES =====================
  /flatmates/swipes:
    post:
      tags: [Swipes]
      summary: Record a swipe
      description: |
        Record a swipe action (like, pass, or super-like) on a property or user profile.
        - For property swipes: set `target_type=property` and provide `property_id`
        - For user swipes: set `target_type=user` and provide `target_user_id`
        - Mutual likes automatically create a match and conversation.
        - Super-likes are capped at 3 per day.
      operationId: recordSwipe
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeRequest'
      responses:
        '200':
          description: Swipe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwipeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Super-like daily limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Super-like daily limit reached

  # ===================== LIKES =====================
  /flatmates/likes:
    get:
      tags: [Likes]
      summary: Get incoming likes
      description: Fetch profiles that have swiped right on the current user but haven't been answered yet.
      operationId: getIncomingLikes
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of incoming likes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncomingLikeSummary'

  /flatmates/outgoing-likes:
    get:
      tags: [Likes]
      summary: Get outgoing likes
      description: Fetch users and listings the current user has swiped right on.
      operationId: getOutgoingLikes
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor for keyset pagination
      responses:
        '200':
          description: Cursor page of outgoing likes
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more, next_cursor, limit]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutgoingLikeSummary'
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
                  limit:
                    type: integer
                  total:
                    type: integer
                    nullable: true

  # ===================== MATCHES =====================
  /flatmates/matches:
    get:
      tags: [Matches]
      summary: Get my matches
      description: Fetch all active matches for the current user.
      operationId: getMyMatches
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchSummary'

  /flatmates/matches/{match_id}/unmatch:
    put:
      tags: [Matches]
      summary: Unmatch
      description: Unmatch a specific match, closing the associated conversation.
      operationId: unmatch
      security:
        - BearerAuth: []
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully unmatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Match removed successfully
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== CONVERSATIONS =====================
  /flatmates/conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      description: Fetch all conversations for the current user, ordered by last message timestamp.
      operationId: listConversations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of conversation summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'

  /flatmates/conversations/{conversation_id}:
    get:
      tags: [Conversations]
      summary: Get conversation detail
      description: Fetch full conversation summary including peer info, unread count, and Q&A state.
      operationId: getConversationDetail
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /flatmates/conversations/{conversation_id}/messages:
    get:
      tags: [Conversations]
      summary: Get conversation messages
      description: Fetch messages for a conversation. Automatically marks unread messages as read.
      operationId: getConversationMessages
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: integer
          description: Fetch messages before this message ID (for pagination)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Number of messages to return
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageOut'

    post:
      tags: [Conversations]
      summary: Send a message
      description: Send a text, image, or visit_request message to a conversation.
      operationId: sendMessage
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOut'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /flatmates/conversations/{conversation_id}/mark-read:
    post:
      tags: [Conversations]
      summary: Mark conversation as read
      description: Mark all peer messages in a conversation as read.
      operationId: markConversationRead
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success

  /flatmates/conversations/{conversation_id}/qna:
    post:
      tags: [Conversations]
      summary: Save Q&A answers
      description: Save guided Q&A answers for a match. Answers are visible to both parties.
      operationId: saveQnAAnswers
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QnAAnswers'
      responses:
        '200':
          description: Q&A answers saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  match_id:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'

  /flatmates/conversations/{conversation_id}/qa:
    post:
      tags: [Conversations]
      summary: Save Q&A answers (short alias)
      description: Alias for `/flatmates/conversations/{conversation_id}/qna`. Saves guided Q&A answers for a match.
      operationId: saveQaAnswers
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QnAAnswers'
      responses:
        '200':
          description: Q&A answers saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  match_id:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'

  /flatmates/visits/{visit_id}:
    put:
      tags: [Visits]
      summary: Update flatmate visit
      description: Update a flatmate meet visit's status or scheduled date (flatmates-scoped). Returns a minimal ack object, not the full Visit resource.
      operationId: updateFlatmateVisit
      security:
        - BearerAuth: []
      parameters:
        - name: visit_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatmateVisitUpdate'
      responses:
        '200':
          description: Updated flatmate visit ack
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    $ref: '#/components/schemas/VisitStatus'
                  updated:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'

  # ===================== VISITS =====================
  /visits:
    post:
      tags: [Visits]
      summary: Schedule a visit
      description: |
        Schedule a flatmate meet or property tour.
        For flatmate meets, set `visit_context=flatmate_meet` and provide `conversation_id` and `counterparty_user_id`.
      operationId: scheduleVisit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitCreate'
      responses:
        '201':
          description: Visit scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags: [Visits]
      summary: Get my visits
      description: Fetch all visits for the current user.
      operationId: getMyVisits
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of visits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPageVisit'

  /visits/upcoming:
    get:
      tags: [Visits]
      summary: Get upcoming visits
      operationId: getUpcomingVisits
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Upcoming visits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSlice'

  /visits/past:
    get:
      tags: [Visits]
      summary: Get past visits
      operationId: getPastVisits
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Past visits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSlice'

  /visits/{visit_id}:
    get:
      tags: [Visits]
      summary: Get visit details
      operationId: getVisitDetails
      security:
        - BearerAuth: []
      parameters:
        - name: visit_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Visit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Visits]
      summary: Update visit
      description: Update visit status or scheduled date. Used for confirm/reschedule/cancel actions.
      operationId: updateVisit
      security:
        - BearerAuth: []
      parameters:
        - name: visit_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitUpdate'
      responses:
        '200':
          description: Updated visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'

  /visits/{visit_id}/reschedule:
    post:
      tags: [Visits]
      summary: Reschedule a visit
      operationId: rescheduleVisit
      security:
        - BearerAuth: []
      parameters:
        - name: visit_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitReschedule'
      responses:
        '200':
          description: Rescheduled visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'

  /visits/{visit_id}/cancel:
    post:
      tags: [Visits]
      summary: Cancel a visit
      operationId: cancelVisit
      security:
        - BearerAuth: []
      parameters:
        - name: visit_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitCancel'
      responses:
        '200':
          description: Cancelled visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'

  /visits/{visit_id}/complete:
    post:
      tags: [Visits]
      summary: Mark visit as completed
      description: Mark a visit as completed with optional notes and feedback.
      operationId: completeVisit
      security:
        - BearerAuth: []
      parameters:
        - name: visit_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitComplete'
      responses:
        '200':
          description: Completed visit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'

  # ===================== LISTINGS =====================
  /properties:
    post:
      tags: [Listings]
      summary: Create a listing
      description: |
        Create a new property listing. For flatmate listings, set `property_type=flatmate` and `purpose=rent`.
        The listing enters manual review (24-hour SLA) before going live.
        AI pre-screening runs automatically before human review.
      operationId: createListing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreate'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags: [Listings]
      summary: Discover listings
      description: |
        Discover listings with comprehensive filtering.
        For flatmate listings, filter with `property_type=flatmate` and `purpose=rent`.
        Supports location-based search, text search, semantic search, and 30+ filter parameters.
      operationId: discoverListings
      security: []
      parameters:
        - name: property_type
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [flatmate, pg]
          description: Filter by property type
        - name: purpose
          in: query
          schema:
            type: string
            enum: [rent]
          description: Filter by purpose
        - name: lat
          in: query
          schema:
            type: number
            format: float
          description: Latitude for location-based search
        - name: lng
          in: query
          schema:
            type: number
            format: float
          description: Longitude for location-based search
        - name: radius
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
          description: Search radius in km
        - name: q
          in: query
          schema:
            type: string
          description: Search query for text or semantic search
        - name: semantic_search
          in: query
          schema:
            type: boolean
            default: false
          description: Enable semantic vector similarity search
        - name: city
          in: query
          schema:
            type: string
        - name: locality
          in: query
          schema:
            type: string
        - name: price_min
          in: query
          schema:
            type: number
            minimum: 0
        - name: price_max
          in: query
          schema:
            type: number
            maximum: 1000000000
        - name: bedrooms_min
          in: query
          schema:
            type: integer
            minimum: 0
        - name: bedrooms_max
          in: query
          schema:
            type: integer
            maximum: 20
        - name: sharing_type
          in: query
          schema:
            type: string
            enum: [private_room, shared_room, master_bedroom, entire_flat]
        - name: gender_preference
          in: query
          schema:
            type: string
            enum: [male, female, any]
        - name: move_in
          in: query
          schema:
            type: string
            enum: [immediate, this_month, next_month, flexible]
          description: Move-in timeline filter
        - name: available_from
          in: query
          schema:
            type: string
            format: date
          description: Minimum availability date (YYYY-MM-DD)
        - name: amenities
          in: query
          schema:
            type: array
            items:
              type: string
        - name: features
          in: query
          schema:
            type: array
            items:
              type: string
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [distance, price_low, price_high, newest, popular, relevance]
            default: newest
        - name: exclude_swiped
          in: query
          schema:
            type: boolean
            default: false
          description: Exclude properties already swiped by the authenticated user
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedPropertyResponse'

  /properties/semantic-search:
    get:
      tags: [Listings]
      summary: Semantic property search
      description: Perform semantic (vector-powered) property search combining vector similarity with traditional filters.
      operationId: semanticSearchListings
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (required for semantic search)
        - name: property_type
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [flatmate, pg]
        - name: city
          in: query
          schema:
            type: string
        - name: locality
          in: query
          schema:
            type: string
        - name: price_min
          in: query
          schema:
            type: number
            minimum: 0
        - name: price_max
          in: query
          schema:
            type: number
            maximum: 1000000000
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated semantic search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedPropertyResponse'
        '400':
          description: Search query required
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: A search query (q) is required for semantic search

  /properties/recommendations:
    get:
      tags: [Listings]
      summary: Get property recommendations
      description: |
        Get property recommendations.
        - With authentication: Personalized recommendations based on user preferences and swipes
        - Without authentication: Popular properties based on likes and recency
      operationId: getPropertyRecommendations
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Recommended properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'

  /properties/me:
    get:
      tags: [Listings]
      summary: Get my listings
      description: List all listings owned by the current user.
      operationId: getMyListings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User's listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'

  /properties/{property_id}:
    get:
      tags: [Listings]
      summary: Get listing details
      description: |
        Get full property details. For flatmate listings, non-live listings are only visible to the owner or admins.
        Enriched with user-specific context (liked status, visit info) when authenticated.
      operationId: getListingDetails
      security: []
      parameters:
        - name: property_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Property details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Listings]
      summary: Update a listing
      description: |
        Update a listing. Owners can update their own listings.
        To pause/resume a listing, update `listing_preferences.moderation_status`.
      operationId: updateListing
      security:
        - BearerAuth: []
      parameters:
        - name: property_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdate'
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Listings]
      summary: Delete a listing
      operationId: deleteListing
      security:
        - BearerAuth: []
      parameters:
        - name: property_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Listing deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Property deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== NOTIFICATIONS =====================
  /flatmates/notifications:
    get:
      tags: [Notifications]
      summary: Get notifications
      description: Fetch all notifications for the current user.
      operationId: getFlatmatesNotifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlatmatesNotificationOut'

    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatmatesNotificationUpdate'
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: All notifications marked as read

  /flatmates/notifications/{notification_id}:
    put:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatmatesNotificationUpdate'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Notification marked as read

  /notifications/devices/register:
    post:
      tags: [Notifications]
      summary: Register FCM device
      description: Register a Firebase Cloud Messaging device token for push notifications.
      operationId: registerFcmDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_token]
              properties:
                device_token:
                  type: string
                  description: FCM device token
                platform:
                  type: string
                  enum: [ios, android, web]
                  description: Device platform
      responses:
        '200':
          description: Device registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Device registered successfully

  /notifications/devices/unregister:
    post:
      tags: [Notifications]
      summary: Unregister FCM device
      description: Unregister a Firebase Cloud Messaging device token.
      operationId: unregisterFcmDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_token]
              properties:
                device_token:
                  type: string
                  description: FCM device token to unregister
      responses:
        '200':
          description: Device unregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Device unregistered successfully

  # ===================== BLOCKS & REPORTS =====================
  /flatmates/blocks:
    get:
      tags: [Blocks & Reports]
      summary: Get blocked users
      description: List all users blocked by the current user.
      operationId: getBlockedUsers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    blocker_user_id:
                      type: integer
                    blocked_user_id:
                      type: integer
                    created_at:
                      type: string
                      format: date-time
                    blocked_user:
                      $ref: '#/components/schemas/FlatmatesPeer'

    post:
      tags: [Blocks & Reports]
      summary: Block a user
      description: |
        Block a user. This closes any active conversation and prevents future matching.
        Set `unmatch_only=true` to unmatch without blocking.
      operationId: blockUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockCreate'
      responses:
        '200':
          description: User blocked
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BlockOut'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Users unmatched successfully

  /flatmates/blocks/{blocked_user_id}:
    delete:
      tags: [Blocks & Reports]
      summary: Unblock a user
      operationId: unblockUser
      security:
        - BearerAuth: []
      parameters:
        - name: blocked_user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User unblocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User unblocked successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /flatmates/reports:
    post:
      tags: [Blocks & Reports]
      summary: Report a user
      description: |
        Report a user for spam, fake profile, abuse, inappropriate content, or other reasons.
        Profiles with 3+ distinct active reports are auto-paused pending admin review.
      operationId: reportUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOut'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ===================== INTERACTIONS =====================
  /flatmates/profile-views:
    post:
      tags: [Interactions]
      summary: Record profile view
      description: |
        Record a profile view event with duration and scroll depth.
        Data-only tracking for V2 smart recommendations.
      operationId: recordProfileView
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileViewEventCreate'
      responses:
        '200':
          description: Profile view recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileViewEventOut'

  /flatmates/listings/{listing_id}/society-tags/votes:
    post:
      tags: [Interactions]
      summary: Vote on society tag
      description: |
        Vote up or down on a society tag for a listing.
        Tags with 3+ downvotes are flagged as community disputed.
      operationId: voteSocietyTag
      security:
        - BearerAuth: []
      parameters:
        - name: listing_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocietyTagVoteCreate'
      responses:
        '200':
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocietyTagVoteOut'

  # ===================== ADMIN MODERATION =====================
  /flatmates/moderation/listings:
    get:
      tags: [Admin Moderation]
      summary: Get listings for moderation
      description: |
        Get listings pending moderation review. Requires admin role.
        Auto-pauses expired listings before returning results.
      operationId: getPendingListings
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: pending_review
          description: Filter by moderation status
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated listings for moderation
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlatmateListingAdmin'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /flatmates/moderation/listings/{listing_id}:
    put:
      tags: [Admin Moderation]
      summary: Moderate a listing
      description: |
        Moderate a listing: approve, reject, or request edit. Requires admin role.
        On first approval, a 24-hour launch boost is automatically applied.
      operationId: moderateListing
      security:
        - BearerAuth: []
      parameters:
        - name: listing_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingModerationAction'
      responses:
        '200':
          description: Moderation action applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing_id:
                    type: integer
                  action:
                    type: string
                    enum: [approve, reject, request_edit]
                  status:
                    type: string
                  reason:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /flatmates/moderation/reports:
    get:
      tags: [Admin Moderation]
      summary: Get reports for moderation
      description: Get user reports pending review. Requires admin role.
      operationId: getPendingReports
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: open
          description: Filter by report status
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated reports for moderation
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportAdmin'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /flatmates/moderation/reports/{report_id}:
    put:
      tags: [Admin Moderation]
      summary: Moderate a report
      description: |
        Moderate a user report: dismiss, warn user, suspend user, or escalate. Requires admin role.
        Suspension deactivates the reported user's account.
      operationId: moderateReport
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportModerationAction'
      responses:
        '200':
          description: Moderation action applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: integer
                  action:
                    type: string
                    enum: [dismiss, warn_user, suspend_user, escalate]
                  status:
                    type: string
                  notes:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /flatmates/moderation/prescreen/{listing_id}:
    post:
      tags: [Admin Moderation]
      summary: Pre-screen a listing
      description: |
        Run deterministic AI pre-screening for a flatmates listing.
        Checks: photos present, required fields, pricing anomalies, spam keywords.
        Requires admin role.
      operationId: prescreenListing
      security:
        - BearerAuth: []
      parameters:
        - name: listing_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pre-screen result
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing_id:
                    type: integer
                  prescreen_result:
                    type: object
                  prescreen_flags:
                    type: array
                    items:
                      type: string
                  prescreen_reason:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth JWT token

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ===================== AUTH SCHEMAS =====================
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        phone:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [user, admin, agent]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        preferences:
          type: object
          additionalProperties: true

    UserLocation:
      type: object
      properties:
        city:
          type: string
        locality:
          type: string
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float

    # ===================== BOOTSTRAP SCHEMAS =====================
    FlatmatesBootstrap:
      type: object
      required: [profile, catalogs, active_listing_count, conversation_count, unread_message_count]
      properties:
        profile:
          $ref: '#/components/schemas/FlatmatesProfile'
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
        active_listing_count:
          type: integer
        conversation_count:
          type: integer
        unread_message_count:
          type: integer

    # ===================== CATALOG SCHEMAS =====================
    CatalogEntry:
      type: object
      required: [key, version, payload]
      properties:
        key:
          type: string
          description: Catalog key (e.g., flatmate_modes, move_in_timelines, quiz_dimensions, vibe_tags)
        version:
          type: integer
        payload:
          type: object
          additionalProperties: true
          description: Catalog data specific to the key

    # ===================== PROFILE SCHEMAS =====================
    FlatmatesProfile:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        profile_image_url:
          type: string
          format: uri
        mode:
          $ref: '#/components/schemas/FlatmatesMode'
        profile_status:
          $ref: '#/components/schemas/FlatmatesProfileStatus'
        onboarding_completed:
          type: boolean
          default: false
        bio:
          type: string
          maxLength: 500
        age:
          type: integer
          minimum: 18
          maximum: 100
        profession:
          type: string
        budget_min:
          type: number
          minimum: 0
        budget_max:
          type: number
          minimum: 0
        move_in_timeline:
          type: string
          enum: [immediate, this_month, next_month, flexible]
        city:
          type: string
        locality:
          type: string
        sleep_schedule:
          type: string
          enum: [early_bird, flexible, night_owl]
        cleanliness:
          type: string
          enum: [minimal, tidy, spotless]
        food_habits:
          type: string
          enum: [vegetarian, non_vegetarian, eggetarian, no_preference]
        smoking:
          type: string
          enum: [never, occasionally, regularly]
        drinking:
          type: string
          enum: [never, occasionally, regularly]
        native_place:
          type: string
          maxLength: 120
        linkedin_url:
          type: string
          maxLength: 255
        age_bucket:
          type: string
          description: Privacy-bucketed age range (18-24, 25-30, 31-35, 36-40, 41-45, 46+)
        guests_policy:
          type: string
          enum: [no_overnight, occasional_ok, open_house]
        work_style:
          type: string
          enum: [wfh_mostly, office_mostly, mixed]
        gender:
          type: string
        gender_preference:
          type: string
          enum: [male, female, any]
        preferences:
          type: object
          additionalProperties: true
          description: Extended flatmate preferences (JSONB)
        last_active_at:
          type: string
          format: date-time

    FlatmatesProfileUpdate:
      type: object
      properties:
        full_name:
          type: string
        profile_image_url:
          type: string
          format: uri
        mode:
          $ref: '#/components/schemas/FlatmatesMode'
        profile_status:
          $ref: '#/components/schemas/FlatmatesProfileStatus'
        onboarding_completed:
          type: boolean
        bio:
          type: string
          maxLength: 500
        age:
