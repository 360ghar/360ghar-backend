        source:
          type: string
          minLength: 1
          maxLength: 64
          default: swipe_deck

    ProfileViewEventOut:
      type: object
      properties:
        id:
          type: integer
        viewer_user_id:
          type: integer
        viewed_user_id:
          type: integer
        context_property_id:
          type: integer
          nullable: true
        source:
          type: string
        duration_seconds:
          type: integer
        scroll_depth_percent:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    SocietyTagVoteCreate:
      type: object
      required: [tag, vote]
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 80
        vote:
          type: string
          enum: [up, down]

    SocietyTagVoteOut:
      type: object
      properties:
        property_id:
          type: integer
        tag:
          type: string
        current_vote:
          type: string
          enum: [up, down]
        upvotes:
          type: integer
        downvotes:
          type: integer
        disputed:
          type: boolean
          default: false
          description: True if tag has 3+ downvotes

